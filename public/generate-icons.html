<!DOCTYPE html>
<html>
<head><title>Generate Icons</title></head>
<body style="font-family:sans-serif;padding:24px;background:#FBF8F4">
<h2>Together — Icon Generator</h2>
<p>Click each button to download the icon, then move both files to <code>public/icons/</code></p>

<div style="display:flex;gap:16px;margin-top:16px">
  <div>
    <canvas id="c192" width="192" height="192" style="border-radius:40px;display:block"></canvas>
    <button onclick="dl('c192','icon-192.png')" style="margin-top:8px;padding:8px 16px;cursor:pointer">Download 192×192</button>
  </div>
  <div>
    <canvas id="c512" width="512" height="512" style="border-radius:108px;display:block"></canvas>
    <button onclick="dl('c512','icon-512.png')" style="margin-top:8px;padding:8px 16px;cursor:pointer">Download 512×512</button>
  </div>
</div>

<script>
function draw(id) {
  const c = document.getElementById(id)
  const s = c.width
  const ctx = c.getContext('2d')
  const r = s * 0.22

  // Background
  const g = ctx.createLinearGradient(0, 0, s, s)
  g.addColorStop(0, '#EDE8F5')
  g.addColorStop(1, '#C4B5E0')
  ctx.fillStyle = g
  ctx.beginPath()
  ctx.roundRect(0, 0, s, s, [r])
  ctx.fill()

  // Heart
  const cx = s / 2, cy = s / 2 - s * 0.02
  const hw = s * 0.36
  ctx.fillStyle = '#9B88C8'
  ctx.beginPath()
  ctx.moveTo(cx, cy + hw * 0.3)
  ctx.bezierCurveTo(cx, cy, cx - hw, cy - hw * 0.3, cx - hw, cy - hw * 0.6)
  ctx.bezierCurveTo(cx - hw, cy - hw * 1.1, cx, cy - hw * 1.1, cx, cy - hw * 0.6)
  ctx.bezierCurveTo(cx, cy - hw * 1.1, cx + hw, cy - hw * 1.1, cx + hw, cy - hw * 0.6)
  ctx.bezierCurveTo(cx + hw, cy - hw * 0.3, cx, cy, cx, cy + hw * 0.3)
  ctx.fill()
}

function dl(id, name) {
  const c = document.getElementById(id)
  const a = document.createElement('a')
  a.download = name
  a.href = c.toDataURL('image/png')
  a.click()
}

draw('c192')
draw('c512')
</script>
</body>
</html>
